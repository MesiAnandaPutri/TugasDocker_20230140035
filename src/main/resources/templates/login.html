<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login | Gen Z Vibes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .word-of-day {
            animation: fadeIn 0.6s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-pink-300 via-purple-300 to-indigo-400 min-h-screen flex items-center justify-center p-6">
<div class="bg-white/80 backdrop-blur-md p-8 rounded-3xl shadow-2xl w-full max-w-md border border-white/50">

    <!-- Profile Image Section -->
    <div class="flex justify-center mb-5">
        <div class="relative">
            <img th:src="@{/image/profile.png}"
                 alt="Profile"
                 class="w-28 h-28 rounded-full border-4 border-pink-400 shadow-lg bg-white">
            <div class="absolute -bottom-1 -right-1 bg-yellow-400 rounded-full p-1.5 shadow-lg">
                <span class="text-xl">✨</span>
            </div>
        </div>
    </div>

    <!-- Word of the Day Section -->
    <div class="word-of-day bg-gradient-to-r from-pink-50 to-purple-50 rounded-xl p-3 mb-6 border-2 border-pink-200 shadow-sm">
        <div class="flex items-start gap-2">
            <span class="text-xl flex-shrink-0">💬</span>
            <div>
                <h3 class="text-xs font-bold text-pink-600 uppercase tracking-wide mb-1">Kata Hari Ini</h3>
                <p class="text-sm font-semibold text-gray-700">"Kesuksesan dimulai dari langkah kecil hari ini"</p>
                <p class="text-xs text-gray-500 mt-1">— Stay motivated! 🚀</p>
            </div>
        </div>
    </div>

    <!-- Error Message (jika ada) -->
    <div th:if="${param.error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-xl mb-4">
        <p class="text-sm">Username atau password salah!</p>
    </div>

    <!-- Success Message (jika ada) -->
    <div th:if="${param.logout}" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded-xl mb-4">
        <p class="text-sm">Logout berhasil!</p>
    </div>

    <form th:action="@{/login}" method="post" class="space-y-5">
        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Username</label>
            <input type="text" name="username" placeholder="Type here..." required
                   class="w-full px-4 py-3 rounded-xl border border-pink-200 focus:ring-2 focus:ring-pink-400 focus:border-transparent outline-none transition-all">
        </div>
        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Password (NIM)</label>
            <input type="password" name="password" placeholder="Your secret code..." required
                   class="w-full px-4 py-3 rounded-xl border border-pink-200 focus:ring-2 focus:ring-pink-400 focus:border-transparent outline-none transition-all">
        </div>
        <button type="submit"
                class="w-full bg-pink-500 hover:bg-pink-600 text-white font-bold py-3 rounded-xl shadow-lg shadow-pink-200 transform hover:scale-[1.02] transition-all duration-200">
            Login
        </button>
    </form>
</div>

<!-- Debug Script -->
<script>
    console.log('Login page loaded');
    document.querySelector('form').addEventListener('submit', function(e) {
        console.log('Form submitted');
        console.log('Username:', document.querySelector('input[name="username"]').value);
        console.log('Password:', document.querySelector('input[name="password"]').value ? 'entered' : 'empty');
    });
</script>

</body>
</html>
