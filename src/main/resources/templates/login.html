<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login | Gen Z Vibes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-pink-300 via-purple-300 to-indigo-400 min-h-screen flex items-center justify-center p-6">
<div class="bg-white/80 backdrop-blur-md p-8 rounded-3xl shadow-2xl w-full max-w-md border border-white/50">
    <div class="text-center mb-8">
        <h2 class="text-3xl font-bold text-pink-600 tracking-tight">Welcome Back! ✨</h2>
        <p class="text-gray-500 text-sm">Login to manage your data</p>
    </div>
    <form th:action="@{/login}" method="post" class="space-y-6">
        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Username</label>
            <input type="text" name="username" placeholder="Type here..." required
                   class="w-full px-4 py-3 rounded-xl border border-pink-200 focus:ring-2 focus:ring-pink-400 focus:border-transparent outline-none transition-all">
        </div>
        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Password (NIM)</label>
            <input type="password" name="password" placeholder="Your secret code..." required
                   class="w-full px-4 py-3 rounded-xl border border-pink-200 focus:ring-2 focus:ring-pink-400 focus:border-transparent outline-none transition-all">
        </div>
        <button type="submit"
                class="w-full bg-pink-500 hover:bg-pink-600 text-white font-bold py-3 rounded-xl shadow-lg shadow-pink-200 transform hover:scale-[1.02] transition-all duration-200">
            Login
        </button>
    </form>
</div>
</body>
</html>
