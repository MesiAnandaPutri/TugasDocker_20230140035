<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dashboard | My Website</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-pink-50 min-h-screen font-sans">
<nav class="bg-white/70 backdrop-blur-md sticky top-0 z-50 border-b border-pink-100 p-4 mb-8">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
        <h1 class="text-xl font-bold text-pink-600">MY Website 20230140035 </h1>
        <a th:href="@{/logout}" class="text-sm font-semibold text-red-400 hover:text-red-600 transition-colors">Logout </a>
    </div>
</nav>

<main class="max-w-6xl mx-auto px-4">
    <div class="bg-white rounded-3xl shadow-xl overflow-hidden border border-pink-100">
        <div class="p-8 bg-gradient-to-r from-pink-500 to-rose-400 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h2 class="text-2xl font-bold text-white">Selamat datang di aplikasi! </h2>
                <p class="text-pink-100 text-sm">Kelola data mahasiswa.</p>
            </div>
            <a th:href="@{/form}" class="bg-white text-pink-600 px-6 py-3 rounded-2xl font-bold shadow-md hover:bg-pink-50 transition-all">
                + Input Data Baru
            </a>
        </div>

        <div class="p-6">
            <h3 class="text-lg font-bold text-gray-700 mb-4 flex items-center gap-2">
                Data Mahasiswa  <span class="bg-pink-100 text-pink-600 text-xs py-1 px-3 rounded-full" th:text="${mahasiswa.size()}">0</span>
            </h3>

            <div class="overflow-x-auto rounded-2xl border border-gray-100">
                <table class="w-full text-left">
                    <thead class="bg-pink-50 text-pink-600 text-sm uppercase">
                    <tr>
                        <th class="px-6 py-4 font-bold">No </th>
                        <th class="px-6 py-4 font-bold">Nama </th>
                        <th class="px-6 py-4 font-bold">NIM </th>
                        <th class="px-6 py-4 font-bold">Jenis Kelamin </th>
                    </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-50 text-gray-600">
                    <tr th:if="${mahasiswa.empty}">
                        <td colspan="4" class="px-6 py-12 text-center text-gray-400 italic">
                            Belum ada data nih... Yuk tambah dulu!
                        </td>
                    </tr>
                    <tr th:each="m, iter : ${mahasiswa}" class="hover:bg-pink-50/50 transition-colors">
                        <td class="px-6 py-4" th:text="${iter.count}">1</td>
                        <td class="px-6 py-4 font-semibold text-gray-800" th:text="${m.nama}">Mesi Ananda Putri</td>
                        <td class="px-6 py-4" th:text="${m.nim}">20230140035</td>
                        <td class="px-6 py-4">
                                    <span th:class="${m.jenisKelamin == 'Laki-laki' ? 'bg-blue-100 text-blue-600' : 'bg-pink-100 text-pink-600'} + ' px-3 py-1 rounded-full text-xs font-bold'"
                                          th:text="${m.jenisKelamin}">Laki-laki</span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>
</body>
</html>
